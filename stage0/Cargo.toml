[package]
name = "kasane-lang"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ksn"
path = "src/main.rs"

[dependencies]
regex = "1"
toml = "0.8"
sha2 = "0.10"
similar = "2"
serde_json = "1"
unicode-normalization = "0.1.26"
unicode-general-category = "1.1.0"

llvm-sys = { version = "201", optional = true, default-features = false, features = ["no-llvm-linking"] }

[features]
# 既定は切 (2026-11-19): 束が ksn (131 MB) を写すため、試験で /tmp があふれた。L2 が束を直してから既定で入れる。
default = []
embedded-llvm = ["dep:llvm-sys"]

[build-dependencies]
sha2 = "0.10"


[profile.release]
opt-level = 2
strip = "symbols"
