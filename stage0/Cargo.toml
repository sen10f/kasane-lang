[package]
name = "kasane-lang"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ksn"
path = "src/main.rs"

[dependencies]
regex = "1"
toml = "0.8"
sha2 = "0.10"
similar = "2"
serde_json = "1"
cranelift-codegen = "0.115"
cranelift-frontend = "0.115"
cranelift-module = "0.115"
cranelift-object = "0.115"
cranelift-native = "0.115"

[profile.release]
opt-level = 2
