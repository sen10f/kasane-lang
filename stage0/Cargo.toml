[package]
license = "MIT OR Apache-2.0"
name = "kasane-lang"
version = "0.1.0-alpha.1"
edition = "2021"

[[bin]]
name = "ksn"
path = "src/main.rs"

[dependencies]
regex = "1"
toml = "0.8"
sha2 = "0.10"
similar = "2"
serde_json = "1"
libc = "0.2"
unicode-normalization = "0.1.26"
unicode-general-category = "1.1.0"

llvm-sys = { version = "201", optional = true, default-features = false, features = ["no-llvm-linking"] }

[dev-dependencies]
sha2 = "0.10"

[features]
default = ["embedded-llvm"]
embedded-llvm = ["dep:llvm-sys"]
test-hooks = []
glibc-compat = []

[build-dependencies]
sha2 = "0.10"


[profile.release]
opt-level = 2
strip = "symbols"
