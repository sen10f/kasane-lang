[package]
name = "kasane-lang"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ksn"
path = "src/main.rs"

[dependencies]
regex = "1"
toml = "0.8"
sha2 = "0.10"
similar = "2"
serde_json = "1"
unicode-normalization = "0.1.26"
unicode-general-category = "1.1.0"

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 2
