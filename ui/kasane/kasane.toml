[package]
name = "ui"
version = "0.1.0"
edition = 1
entry = "ui.main"

[unsafe]
modules = ["ui.gpu", "ui.plat", "ui.text"]

[native]
static = ["../native/libksnui.a"]
dynamic = ["wgpu_native", "vulkan", "dl", "m", "pthread", "freetype", "harfbuzz", "ksnui"]
search = ["../native", "../native/third_party/lib"]
